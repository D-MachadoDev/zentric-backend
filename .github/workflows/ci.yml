name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'
    - name: Restore dependencies
      run: dotnet restore Zentric.slnx
    - name: Build
      run: dotnet build Zentric.slnx --no-restore
    - name: Test
      run: dotnet test Zentric.slnx --no-build --verbosity normal
