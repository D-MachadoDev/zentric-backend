services:
  db:
    image: postgres:16-alpine
    container_name: zentric-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ZentricDb
    ports:
      - "5432:5432"
    volumes:
      - zentric_pgdata:/var/lib/postgresql/data

  api:
    image: zentric-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zentric-api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=ZentricDb;Username=postgres;Password=postgres
    ports:
      - "5076:8080"

volumes:
  zentric_pgdata:
